openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts book
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of contacts app
tags:
  - name: Contacts
    description: Operations about contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: https://nodejs-hw-mongodb-5-a3jc.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml

    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml

    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml

    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml

  /auth/register:
    post:
      $ref: ../swagger/paths/auth/postRegister.yaml

  /auth/login:
    post:
      $ref: ../swagger/paths/auth/postLogin.yaml

  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/postRefresh.yaml

  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/postLogout.yaml

  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auth/postSendEmail.yaml

  /auth/reset-pwd:
    post:
      $ref: ../swagger/paths/auth/postResetPassword.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
