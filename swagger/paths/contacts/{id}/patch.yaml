tags:
  - Contacts
summary: Update contacts
operationId: updateContact
description: 'Update a contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b5983849
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
      properties:
        _id:
          description: "Contact's id"
          type: string
          example: 65e4decdd286b30065d54af9
        name:
          description: "Contact's name"
          type: string
          example: 'John Doe'
        phoneNumber:
          description: "Contact's phone number"
          type: number
          example: +380999888777
        email:
          description: "Contact's email"
          type: string
          example: test@gmail.com
        isFavourite:
          description: "Contact's favourite status"
          type: boolean
          example: true
        contactType:
          description: "Contact's type"
          type: string
          enum: ['work', 'home', 'personal']
          example: home
        userId:
          description: "Contact's user id"
          type: string
          example: 65e4decdd28991165d54af9
        photo:
          description: "Link to contact's photo"
          type: string
          example: https://res.cloudinary.com/dwiv6erzd/image/upload/v1731361127/photo1.jpg
responses:
  '200':
    description: Updatetd contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
