tags:
  - Contacts
summary: Delete contacts by id
operationId: delContacts
description: 'Delete contacts by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b5983849
responses:
  '204':
    description: 'Delete contacts by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: No content!

  '404':
    $ref: ../../../components/responses/404.yaml
