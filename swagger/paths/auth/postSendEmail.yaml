tags:
  - Auth
summary: Send reset email
operationId: sendResetEmail
description: 'Request to reset the password for a user'
security:
  - bearerAuth: []
requestBody:
  content:
    aplication/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: "User's email"
            type: string
            example: test@gmail.com
responses:
  '200':
    description:
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    $ref: ../../components/responses/500.yaml
