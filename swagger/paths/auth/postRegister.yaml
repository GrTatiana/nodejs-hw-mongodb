tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'User register'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
          - userId
        properties:
          userId:
            description: "User's id"
            type: string
            example: 65e4decdd286b30065d54af9
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: test@gmail.com
          password:
            description: "User's password"
            type: string
            example: '********'
responses:
  '201':
    description: User registration
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              $ref: ../../components/schemas/user.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '409':
    description: User registration
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Email in use!'
  '500':
    $ref: ../../components/responses/500.yaml
