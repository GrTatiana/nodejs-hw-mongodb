tags:
  - Auth
summary: Log in user
operationId: loginUser
description: 'User Login'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: test@gmail.com
          password:
            description: "User's password"
            type: string
            example: '********'
responses:
  '200':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: string
              example: 'accessToken: 5tfqjDxYEP9DPY3SuIo53H+hI0hr95uqwHF7IEaO9sP+/ozTsN5Wfw==
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml  
