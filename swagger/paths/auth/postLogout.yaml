tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: 'User Logout'
security:
  - bearerAuth: []
requestBody:
  content:
    aplication/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
          - userId
        properties:
          userId:
            description: "User's id"
            type: string
            example: 65e4decdd286b30065d54af9
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: test@gmail.com
          password:
            description: "User's password"
            type: string
            example: '********'
responses:
  '204':
    description: The user is logged out
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: No content!
  '401':
    description: Email or password is not correct!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Invalid data
  '500':
    $ref: ../../components/responses/500.yaml
