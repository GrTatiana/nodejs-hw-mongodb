tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Resetting the user password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - token
    properties:
      email:
        description: "User's email"
        type: string
        example: test@gmail.com
      token:
        description: "User's actived sesson token"
        type: string
        example: '67ytqjDxYEP9DPY3SuIo53H+hI0hr95uqwHF7IEaO9sP+/ozTsN5Wfw=='
responses:
  '200':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
  '401':
    description:
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Token is expired or invalid.'
  '404':
    $ref: ../../components/responses/404.yaml
