type: object
required:
  - name
  - email
  - password
  - userId
properties:
  userId:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: test@gmail.com
  password:
    type: string
    example: '**********'
