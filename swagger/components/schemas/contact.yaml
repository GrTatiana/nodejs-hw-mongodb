type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: +380999888777
  # email:
  #   description: "Contact's email"
  #   type: string
  #   example: test@gmail.com
  isFavourite:
    description: "Contact's favourite status"
    type: boolean
    example: true
    default: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: home
    default: 'personal'
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd28991165d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/dwiv6erzd/image/upload/v1731361127/photo1.
